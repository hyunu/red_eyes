[project]
name = "red-eyes"
version = "0.1.0"
description = "Local AI CCTV behavior analysis system for Mac Mini M1"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9.0",
    "ultralytics>=8.1.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "aiogram>=3.4.0",
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    "pillow>=10.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
red-eyes = "red_eyes.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
